name: Release train

# woow release train: compare this repository's upstream version pins with the version manifest
# shared by HA and the WOOW PaaS (Gitea woow-paas/woow-release-train, public mirror
# WOOWTECH/woow-release-train). What fails is decided by the manifest's `enforcement`, not here.
# Only the OpenDesign core (open-design-core build id and digest, the OpenDesign version of its
# contract) is compared; in phase 3 the result is a warning only (the product has no hard rules yet).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Release train
    uses: WOOWTECH/woow-release-train/.github/workflows/wvt-check.yml@5cb9f40e29cad3b70cbdfd73859dd1113afb710c  # main 2026-10-24; this repository pins workflow refs to commits
