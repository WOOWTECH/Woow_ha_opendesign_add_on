name: Validate, build, and publish

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      candidate_core_image:
        description: "Branch candidate only: approved immutable core image (empty uses normal checks)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  # Shared WoowTech OpenDesign core image (PaaS open-design image), published as
  # the public ghcr.io/woowtech/open-design-core, pinned by digest (same as Dockerfile).
  CORE_IMAGE: ghcr.io/woowtech/open-design-core:20261027.1127@sha256:c8cd57f07adaef23b8dddbb22a8b75f97bdf8ca42c8bfbec1b284dc60ee5a4cf

# A newer push may cancel a pull request run, never a main run: that one may be
# publishing a release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.0"
          cache: npm
          cache-dependency-path: runtime/package-lock.json
      - name: Install validation tools
        run: |
          python3 -m pip install --break-system-packages PyYAML==6.0.2
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nginx shellcheck
      - name: Validate
        run: ./tests/run.sh

  smoke:
    if: ${{ ! inputs.candidate_core_image }}
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build amd64 smoke image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: woow-ha-opendesign:smoke
          build-args: |
            BUILD_FROM=${{ env.CORE_IMAGE }}
            BUILD_ARCH=amd64
            BUILD_VERSION=0.1.0-smoke
            BUILD_DESCRIPTION=OpenDesign 0.24.1 core container smoke
            BUILD_NAME=Woow HA OpenDesign
            BUILD_REF=${{ github.sha }}
            BUILD_REPOSITORY=${{ github.repository }}
          cache-from: type=gha,scope=opendesign-amd64
          cache-to: type=gha,scope=opendesign-amd64,mode=max
      - name: Container, renderer, and browser ingress smoke
        run: ./tests/container-smoke.sh woow-ha-opendesign:smoke

  build-nonrelease:
    if: ${{ ! inputs.candidate_core_image }}
    needs: [validate, smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Read add-on version
        id: metadata
        shell: bash
        run: echo "version=$(awk -F'\"' '/^version:/ { print $2 }' config.yaml)" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@53851d14592bedcffcf25ea515637cff71ef929a # v3.3.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build architecture image without publishing
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          provenance: false
          tags: ghcr.io/woowtech/woow-ha-opendesign-${{ matrix.arch }}:${{ steps.metadata.outputs.version }}
          build-args: |
            BUILD_FROM=${{ env.CORE_IMAGE }}
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ steps.metadata.outputs.version }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
            BUILD_DESCRIPTION=OpenDesign 0.24.1 (WoowTech core) for Home Assistant Ingress
            BUILD_NAME=Woow HA OpenDesign
            BUILD_REF=${{ github.sha }}
            BUILD_REPOSITORY=${{ github.repository }}
          cache-from: type=gha,scope=opendesign-${{ matrix.arch }}
          cache-to: type=gha,scope=opendesign-${{ matrix.arch }},mode=max
      - name: Verify bundled agent CLIs as UID 1001
        run: |
          docker run --rm --platform ${{ matrix.platform }} --user 1001:1001 \
            --entrypoint /bin/sh \
            ghcr.io/woowtech/woow-ha-opendesign-${{ matrix.arch }}:${{ steps.metadata.outputs.version }} \
            -ceu '
              test "$(id -u)" = 1001
              test "$(opencode --version)" = 1.18.33
              test "$(command -v opencode)" = /usr/local/bin/opencode
              claude --version | grep -Fq 2.1.296
              codex --version | grep -Fq 0.162.1
              pi --version | grep -Fq 1.1.0
              ! command -v opencode-cli >/dev/null 2>&1
              command -v claude >/dev/null
              command -v codex >/dev/null
              command -v pi >/dev/null
              test ! -e /opt/ha-opendesign/ha-pi-wrapper.mjs
            '

  # A dispatch on a review branch builds and tests the candidate locally, then
  # pushes those exact bytes to a unique prerelease tag. No Store Release/tag.
  publish-candidate:
    if: github.event_name == 'workflow_dispatch' && inputs.candidate_core_image != '' && github.ref != 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    env:
      CANDIDATE_CORE_IMAGE: ${{ inputs.candidate_core_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate candidate scope and immutable core
        id: candidate
        run: python3 .github/scripts/candidate-release.py plan
      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Check anonymous JCR registry endpoint
        if: startsWith(steps.candidate.outputs.core, 'jcr-prod.woowtech.io/')
        run: python3 -B .github/scripts/registry-preflight.py
      - name: Log in to JCR for candidate core read
        if: startsWith(steps.candidate.outputs.core, 'jcr-prod.woowtech.io/')
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: jcr-prod.woowtech.io
          username: ${{ secrets.JCR_RO_USERNAME }}
          password: ${{ secrets.JCR_RO_PASSWORD }}
      - name: Build candidate locally
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: ${{ steps.candidate.outputs.image }}
          build-args: |
            BUILD_FROM=${{ steps.candidate.outputs.core }}
            BUILD_ARCH=amd64
            BUILD_VERSION=${{ steps.candidate.outputs.version }}
            BUILD_REF=${{ github.sha }}
            BUILD_REPOSITORY=${{ github.repository }}
          cache-from: type=gha,scope=opendesign-amd64
          cache-to: type=gha,scope=opendesign-amd64,mode=max
      - name: Full candidate container smoke
        env:
          CANDIDATE_IMAGE: ${{ steps.candidate.outputs.image }}
        run: ./tests/container-smoke.sh "$CANDIDATE_IMAGE"
      - name: Refuse existing candidate tag
        env:
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/candidate-release.py preflight
      - name: Log in to GHCR after smoke
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push tested candidate and verify anonymous manifest
        env:
          CANDIDATE_IMAGE: ${{ steps.candidate.outputs.image }}
        shell: bash
        run: |
          set -Eeuo pipefail
          docker push "$CANDIDATE_IMAGE"
          PUSHED_DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' "$CANDIDATE_IMAGE")
          export PUSHED_DIGEST="${PUSHED_DIGEST##*@}"
          python3 .github/scripts/candidate-release.py verify
      - name: Upload candidate receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ha-candidate-receipt
          path: candidate-receipt.json
          if-no-files-found: error

  # A release is merging a config.yaml version bump to main (ADR-0005 in the
  # WOOW addon pipeline). Pushing a tag no longer starts anything: it would skip
  # the pull request checks. Every main run whose version has no Release yet
  # goes through preflight, the architecture gate and publishing; a version
  # that is already released is left alone, so its image is never rebuilt.
  release-plan:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && ! inputs.candidate_core_image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      release: ${{ steps.plan.outputs.release }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Decide whether this version needs a release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          version=$(awk -F'"' '/^version:/ { print $2 }' config.yaml)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "config.yaml version '${version}' is not x.y.z" >&2; exit 1; }
          if gh release view "v${version}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::v${version} is already released; nothing to publish"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v${version} has no Release yet; publishing it from this commit"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  release-preflight:
    if: needs.release-plan.outputs.release == 'true'
    needs: [validate, smoke, release-plan]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Enforce immutable release version
        env:
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./.github/scripts/release-preflight.sh

  release-architecture-gate:
    if: needs.release-plan.outputs.release == 'true'
    needs: [validate, smoke, release-plan, release-preflight]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Read add-on version
        id: metadata
        shell: bash
        run: echo "version=$(awk -F'\"' '/^version:/ { print $2 }' config.yaml)" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@53851d14592bedcffcf25ea515637cff71ef929a # v3.3.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build release-gate architecture image without publishing
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          provenance: false
          tags: woow-ha-opendesign-release-gate-${{ matrix.arch }}:${{ steps.metadata.outputs.version }}
          build-args: |
            BUILD_FROM=${{ env.CORE_IMAGE }}
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ steps.metadata.outputs.version }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
            BUILD_DESCRIPTION=OpenDesign 0.24.1 (WoowTech core) for Home Assistant Ingress
            BUILD_NAME=Woow HA OpenDesign
            BUILD_REF=${{ github.sha }}
            BUILD_REPOSITORY=${{ github.repository }}
          cache-from: type=gha,scope=opendesign-${{ matrix.arch }}
          cache-to: type=gha,scope=opendesign-${{ matrix.arch }},mode=max
      - name: Verify native OpenCode BYOK streaming and key isolation
        env:
          IMAGE: woow-ha-opendesign-release-gate-${{ matrix.arch }}:${{ steps.metadata.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          BYOK_FAKE_KEY: od-byok-test-key-not-a-secret
        shell: bash
        run: |
          set -Eeuo pipefail
          container="woow-od-release-gate-${{ matrix.arch }}-${RANDOM}"
          volume="woow-od-release-gate-data-${{ matrix.arch }}-${RANDOM}"
          cleanup() {
            local status=$?
            if (( status != 0 )); then
              docker logs "$container" >&2 || true
            fi
            docker rm -f "$container" >/dev/null 2>&1 || true
            docker volume rm "$volume" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker volume create "$volume" >/dev/null
          docker run -d --name "$container" --platform "$PLATFORM" \
            -v "$volume:/data" "$IMAGE" >/dev/null
          for attempt in $(seq 1 90); do
            if docker exec "$container" node -e "fetch('http://127.0.0.1:8099/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"; then
              break
            fi
            if ! docker inspect -f '{{.State.Running}}' "$container" | grep -qx true; then
              exit 1
            fi
            sleep 1
            if [ "$attempt" = 90 ]; then
              echo 'health endpoint did not become ready' >&2
              exit 1
            fi
          done

          docker exec --user 1001:1001 "$container" sh -ceu '
            test "$(id -u)" = 1001
            test "$(opencode --version)" = 1.18.33
            test "$(command -v opencode)" = /usr/local/bin/opencode
            claude --version | grep -Fq 2.1.296
            codex --version | grep -Fq 0.162.1
            pi --version | grep -Fq 1.1.0
            command -v claude >/dev/null
            command -v codex >/dev/null
            command -v pi >/dev/null
            ! command -v opencode-cli >/dev/null 2>&1
            test ! -e /opt/ha-opendesign/ha-pi-wrapper.mjs
          '
          docker cp tests/container-opencode-byok-e2e.mjs "$container:/tmp/container-opencode-byok-e2e.mjs"
          docker exec "$container" node /tmp/container-opencode-byok-e2e.mjs
          # Logs to a file first: `docker logs | grep -q` can end in SIGPIPE (141) under pipefail.
          docker logs "$container" >"${RUNNER_TEMP}/release-gate-container.log" 2>&1
          if grep -Fq -- "$BYOK_FAKE_KEY" "${RUNNER_TEMP}/release-gate-container.log"; then
            echo 'fake BYOK key leaked to container logs' >&2
            exit 1
          fi
          if docker exec "$container" sh -ceu '
            if grep -R -I -F -q -- "$1" /data; then
              exit 1
            fi
          ' sh "$BYOK_FAKE_KEY"; then
            :
          else
            echo 'fake BYOK key leaked to /data persisted artifacts' >&2
            exit 1
          fi

  publish-release:
    if: needs.release-plan.outputs.release == 'true'
    needs: [validate, smoke, release-plan, release-preflight, release-architecture-gate]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Read add-on version
        id: metadata
        shell: bash
        run: echo "version=$(awk -F'\"' '/^version:/ { print $2 }' config.yaml)" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@53851d14592bedcffcf25ea515637cff71ef929a # v3.3.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Log in to GHCR
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable architecture image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          tags: ghcr.io/woowtech/woow-ha-opendesign-${{ matrix.arch }}:${{ steps.metadata.outputs.version }}
          build-args: |
            BUILD_FROM=${{ env.CORE_IMAGE }}
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ steps.metadata.outputs.version }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
            BUILD_DESCRIPTION=OpenDesign 0.24.1 (WoowTech core) for Home Assistant Ingress
            BUILD_NAME=Woow HA OpenDesign
            BUILD_REF=${{ github.sha }}
            BUILD_REPOSITORY=${{ github.repository }}
          cache-from: type=gha,scope=opendesign-${{ matrix.arch }}
          cache-to: type=gha,scope=opendesign-${{ matrix.arch }},mode=max

  # The App Store ships only published Releases (registry ref_policy: release).
  # Once the image is published, the Store's shared workflow creates the
  # v<version> tag and Release on this main commit.
  release:
    name: Release
    needs: [release-plan, publish-release]
    if: needs.release-plan.outputs.release == 'true'
    permissions:
      contents: write
    # Pinned like every action here (tests/validate.py). The pinned workflow still runs
    # the Store main tooling and registry, so only a change to the workflow file
    # itself needs a new pin.
    uses: WOOWTECH/Woow_HA_App_Store/.github/workflows/woow-addon-release.yml@2cf52485fef8f44771250c92ee73680d8b5b1619 # main 2026-10-12
