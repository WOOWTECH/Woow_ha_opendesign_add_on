name: Validate, build, and publish

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.0"
          cache: npm
          cache-dependency-path: runtime/package-lock.json
      - name: Install validation tools
        run: |
          python3 -m pip install --break-system-packages PyYAML==6.0.2
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nginx shellcheck
      - name: Validate
        run: ./tests/run.sh

  smoke:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build amd64 smoke image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: woow-ha-opendesign:smoke
          build-args: |
            BUILD_FROM=ghcr.io/nexu-io/od:0.21.1
            BUILD_ARCH=amd64
            BUILD_VERSION=0.1.0-smoke
            BUILD_DESCRIPTION=OpenDesign 0.21.1 container smoke
            BUILD_NAME=Woow HA OpenDesign
            BUILD_REF=${{ github.sha }}
            BUILD_REPOSITORY=${{ github.repository }}
          cache-from: type=gha,scope=opendesign-smoke-amd64
          cache-to: type=gha,scope=opendesign-smoke-amd64,mode=max
      - name: Container, renderer, and HTTP export smoke
        run: ./tests/container-smoke.sh woow-ha-opendesign:smoke

  build:
    needs: [validate, smoke]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Read add-on version
        id: metadata
        shell: bash
        run: |
          echo "version=$(awk -F'"' '/^version:/ { print $2 }' config.yaml)" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          provenance: false
          tags: ghcr.io/woowtech/woow-ha-opendesign-${{ matrix.arch }}:${{ steps.metadata.outputs.version }}
          build-args: |
            BUILD_FROM=ghcr.io/nexu-io/od:0.21.1
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ steps.metadata.outputs.version }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
            BUILD_DESCRIPTION=OpenDesign 0.21.1 for Home Assistant Ingress
            BUILD_NAME=Woow HA OpenDesign
            BUILD_REF=${{ github.sha }}
            BUILD_REPOSITORY=${{ github.repository }}
          cache-from: type=gha,scope=opendesign-${{ matrix.arch }}
          cache-to: type=gha,scope=opendesign-${{ matrix.arch }},mode=max
