name: Validate, build, and publish

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.0"
          cache: npm
          cache-dependency-path: runtime/package-lock.json
      - name: Install validation tools
        run: |
          python3 -m pip install --break-system-packages PyYAML==6.0.2
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nginx shellcheck
      - name: Validate
        run: ./tests/run.sh

  smoke:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build amd64 smoke image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: woow-ha-opendesign:smoke
          build-args: |
            BUILD_FROM=ghcr.io/nexu-io/od:0.21.1@sha256:441daca881e699657bacf28e0c27b16cd6be551dfff4bd63368dd74bec581f39
            BUILD_ARCH=amd64
            BUILD_VERSION=0.1.0-smoke
            BUILD_DESCRIPTION=OpenDesign 0.21.1 container smoke
            BUILD_NAME=Woow HA OpenDesign
            BUILD_REF=${{ github.sha }}
            BUILD_REPOSITORY=${{ github.repository }}
          cache-from: type=gha,scope=opendesign-amd64
          cache-to: type=gha,scope=opendesign-amd64,mode=max
      - name: Container, renderer, and browser ingress smoke
        run: ./tests/container-smoke.sh woow-ha-opendesign:smoke

  build-nonrelease:
    if: github.ref_type != 'tag'
    needs: [validate, smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Read add-on version
        id: metadata
        shell: bash
        run: echo "version=$(awk -F'\"' '/^version:/ { print $2 }' config.yaml)" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@53851d14592bedcffcf25ea515637cff71ef929a # v3.3.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build architecture image without publishing
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          provenance: false
          tags: ghcr.io/woowtech/woow-ha-opendesign-${{ matrix.arch }}:${{ steps.metadata.outputs.version }}
          build-args: |
            BUILD_FROM=ghcr.io/nexu-io/od:0.21.1@sha256:441daca881e699657bacf28e0c27b16cd6be551dfff4bd63368dd74bec581f39
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ steps.metadata.outputs.version }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
            BUILD_DESCRIPTION=OpenDesign 0.21.1 for Home Assistant Ingress
            BUILD_NAME=Woow HA OpenDesign
            BUILD_REF=${{ github.sha }}
            BUILD_REPOSITORY=${{ github.repository }}
          cache-from: type=gha,scope=opendesign-${{ matrix.arch }}
          cache-to: type=gha,scope=opendesign-${{ matrix.arch }},mode=max
      - name: Verify locked OpenCode runtime as UID 1001
        run: |
          docker run --rm --platform ${{ matrix.platform }} --user 1001:1001 \
            --entrypoint /bin/sh \
            ghcr.io/woowtech/woow-ha-opendesign-${{ matrix.arch }}:${{ steps.metadata.outputs.version }} \
            -ceu '
              test "$(id -u)" = 1001
              test "$(opencode --version)" = 1.18.29
              test "$(command -v opencode)" = /opt/ha-opendesign/opencode/node_modules/.bin/opencode
              ! command -v opencode-cli >/dev/null 2>&1
              ! command -v pi >/dev/null 2>&1
              test ! -e /usr/local/bin/pi
              test ! -e /opt/ha-opendesign/ha-pi-wrapper.mjs
            '

  release-preflight:
    if: github.ref_type == 'tag'
    needs: [validate, smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Enforce immutable release version
        env:
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./.github/scripts/release-preflight.sh

  release-architecture-gate:
    if: github.ref_type == 'tag'
    needs: [validate, smoke, release-preflight]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Read add-on version
        id: metadata
        shell: bash
        run: echo "version=$(awk -F'\"' '/^version:/ { print $2 }' config.yaml)" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@53851d14592bedcffcf25ea515637cff71ef929a # v3.3.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build release-gate architecture image without publishing
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          provenance: false
          tags: woow-ha-opendesign-release-gate-${{ matrix.arch }}:${{ steps.metadata.outputs.version }}
          build-args: |
            BUILD_FROM=ghcr.io/nexu-io/od:0.21.1@sha256:441daca881e699657bacf28e0c27b16cd6be551dfff4bd63368dd74bec581f39
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ steps.metadata.outputs.version }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
            BUILD_DESCRIPTION=OpenDesign 0.21.1 for Home Assistant Ingress
            BUILD_NAME=Woow HA OpenDesign
            BUILD_REF=${{ github.sha }}
            BUILD_REPOSITORY=${{ github.repository }}
          cache-from: type=gha,scope=opendesign-${{ matrix.arch }}
          cache-to: type=gha,scope=opendesign-${{ matrix.arch }},mode=max
      - name: Verify native OpenCode BYOK streaming and key isolation
        env:
          IMAGE: woow-ha-opendesign-release-gate-${{ matrix.arch }}:${{ steps.metadata.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          BYOK_FAKE_KEY: od-byok-test-key-not-a-secret
        shell: bash
        run: |
          set -Eeuo pipefail
          container="woow-od-release-gate-${{ matrix.arch }}-${RANDOM}"
          volume="woow-od-release-gate-data-${{ matrix.arch }}-${RANDOM}"
          cleanup() {
            local status=$?
            if (( status != 0 )); then
              docker logs "$container" >&2 || true
            fi
            docker rm -f "$container" >/dev/null 2>&1 || true
            docker volume rm "$volume" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker volume create "$volume" >/dev/null
          docker run -d --name "$container" --platform "$PLATFORM" \
            -v "$volume:/data" "$IMAGE" >/dev/null
          for attempt in $(seq 1 90); do
            if docker exec "$container" node -e "fetch('http://127.0.0.1:8099/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"; then
              break
            fi
            if ! docker inspect -f '{{.State.Running}}' "$container" | grep -qx true; then
              exit 1
            fi
            sleep 1
            if [ "$attempt" = 90 ]; then
              echo 'health endpoint did not become ready' >&2
              exit 1
            fi
          done

          docker exec --user 1001:1001 "$container" sh -ceu '
            test "$(id -u)" = 1001
            test "$(opencode --version)" = 1.18.29
            test "$(command -v opencode)" = /opt/ha-opendesign/opencode/node_modules/.bin/opencode
            ! command -v opencode-cli >/dev/null 2>&1
            ! command -v pi >/dev/null 2>&1
            test ! -e /usr/local/bin/pi
            test ! -e /opt/ha-opendesign/ha-pi-wrapper.mjs
          '
          docker cp tests/container-opencode-byok-e2e.mjs "$container:/tmp/container-opencode-byok-e2e.mjs"
          docker exec "$container" node /tmp/container-opencode-byok-e2e.mjs
          if docker logs "$container" 2>&1 | grep -Fq -- "$BYOK_FAKE_KEY"; then
            echo 'fake BYOK key leaked to container logs' >&2
            exit 1
          fi
          if docker exec "$container" sh -ceu '
            if grep -R -I -F -q -- "$1" /data; then
              exit 1
            fi
          ' sh "$BYOK_FAKE_KEY"; then
            :
          else
            echo 'fake BYOK key leaked to /data persisted artifacts' >&2
            exit 1
          fi

  publish-release:
    if: github.ref_type == 'tag'
    needs: [validate, smoke, release-preflight, release-architecture-gate]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Read add-on version
        id: metadata
        shell: bash
        run: echo "version=$(awk -F'\"' '/^version:/ { print $2 }' config.yaml)" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@53851d14592bedcffcf25ea515637cff71ef929a # v3.3.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Log in to GHCR
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable architecture image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          tags: ghcr.io/woowtech/woow-ha-opendesign-${{ matrix.arch }}:${{ steps.metadata.outputs.version }}
          build-args: |
            BUILD_FROM=ghcr.io/nexu-io/od:0.21.1@sha256:441daca881e699657bacf28e0c27b16cd6be551dfff4bd63368dd74bec581f39
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ steps.metadata.outputs.version }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
            BUILD_DESCRIPTION=OpenDesign 0.21.1 for Home Assistant Ingress
            BUILD_NAME=Woow HA OpenDesign
            BUILD_REF=${{ github.sha }}
            BUILD_REPOSITORY=${{ github.repository }}
          cache-from: type=gha,scope=opendesign-${{ matrix.arch }}
          cache-to: type=gha,scope=opendesign-${{ matrix.arch }},mode=max
